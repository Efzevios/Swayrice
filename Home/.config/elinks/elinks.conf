# =====================
# Elinks
# =====================
## I. Configurações
### I.I. Pesquisa padrão sem JavaScript
set protocol.rewrite.default_template = "https://lite.duckduckgo.com/lite/?q=%s"
### I.II. Atalhos para outros mecanismos
set protocol.rewrite.smart.ddg = "https://lite.duckduckgo.com/lite/?q=%s"
set protocol.rewrite.smart.google = "https://www.google.com/search?q=%s"
set protocol.rewrite.smart.brave = "https://search.brave.com/search?q=%s"
### I.III. Manter cores dos sites, exceto o fundo
set document.colors.use_document_colors = 1
### I.IV. Cores padrão
set document.colors.background = "#282524"
set document.colors.text = "#ebdbb2"
### I.V. Evitar inversão de cores nos links selecionados
set document.browse.links.active_link.invert = 0
set document.browse.links.active_link.enable_color = 1
set document.browse.links.active_link.colors.background = "#282524"
set document.browse.links.active_link.colors.text = "#cc241d"
### I.VI. Habilitar cores reais no Foot
set terminal.foot.colors = 4
### I.VII. Sessões
### I.VII.I. Não manter a sessão ativa após fechar o terminal
set ui.sessions.keep_session_active = 0
### I.VII.I. Não criar um processo independente na inicialização
set ui.sessions.fork_on_start = 0
